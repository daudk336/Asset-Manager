kind = "web"
previewPath = "/"
title = "Skipio Homepage"
version = "1.0.0"
id = "artifacts/skipio-homepage"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22331

[services.development]
run = "pnpm --filter @workspace/skipio-homepage run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/skipio-homepage", "run", "build" ]
publicDir = "artifacts/skipio-homepage/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22331"
BASE_PATH = "/"
